name: Accessibility
on:
  push:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  accessibility-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WCAG 2.2 AA static scan
        env:
          INPUT_SCAN_TYPE: web
          INPUT_PROFILE: moderate
          INPUT_FAIL_ON: serious
          INPUT_PATHS: .
          INPUT_SARIF_FILE: a11y-results.sarif
        run: node tools/accessibility-scan.mjs
      - name: Upload accessibility SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: a11y-results.sarif
          category: accessibility
        continue-on-error: true
